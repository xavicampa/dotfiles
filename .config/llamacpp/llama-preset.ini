; Note: llama device order in the container is CUDA0=3090 Ti, CUDA1=5070 Ti (reversed vs host nvidia-smi).
; op-offload = off
; no mmap: model ~90 GB; mmap + CPU tensor overrides logged perf warnings, and mmap mode previously
; let CUDA OOM force a no-pipeline-parallelism fallback on the 3090. Costs ~40 GB committed RAM +
; ~33 s load (vs 22 s), but no OOM retries since.
