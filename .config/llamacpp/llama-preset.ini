ctx-size = 131072
ctk = q8_0
ctv = q8_0
spec-type = draft-mtp
; shared- head: borrows token embedding + output projection from the main model (recommended by repo README)
; self-contained variant fails here: check_tensor_dims 'output_hc_norm.weight' not found
spec-draft-model = /root/.cache/huggingface/hub/models--unsloth--Qwen3.8-Flash-Next-GGUF/snapshots/38bb39ee97821de2c9009abb7e93950eec396e66/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
spec-draft-n-max = 2
; shared head is unmeasurable by the fitter (borrowed tensors), so it got OOM'd at
; 2647 MiB on device 1. Pin the draft to the 24G card and reserve 3G margin there;
; the margin costs ~3G of main-model GPU residency (weights shift to CPU RAM).
; spec-draft-device = 1
; margin for the unmeasurable shared-head MTP draft (~2.6 GB) on device 1 = 5070 Ti.
; The 1434 MiB compute buffer (ubatch 1024) still OOMs at load -> "retrying without pipeline
; parallelism". The fallback is HARMLESS: prefill measured ~600 t/s with it (2026-09-29).
; Raising the margin (5632) to avoid the OOM starved GPU weights and regressed prefill - do not.
; Note: llama device order in the container is CUDA0=3090 Ti (PCIe 4.0 x4!), CUDA1=5070 Ti (x16)
; (reversed vs host nvidia-smi). Verify traffic: nvidia-smi dmon -s t (rxpci/txpci MB/s per GPU).
fit-target = 0,3072
; op-offload = off   ; DO NOT re-enable: regresses prompt processing to < 200 t/s (measured 2026-09-29)
; no mmap: mmap + CPU tensor overrides logged perf warnings and earlier OOM retries. Costs
; ~40 GB committed RAM + ~33 s load, no downside seen.
load-mode = none
; ubatch is THE prefill lever: defaults (b 2048 / ub 512) ~250 t/s -> ~600 t/s here.
; Prefill saturates the 5070 Ti x16 link (~28 GB/s rx); the 3090 Ti stays near idle.
batch-size = 8192
ubatch-size = 1024
temperature = 1.0
min-p = 0.00
top-p = 0.95
top-k = 20
repeat-penalty = 1.0
presence-penalty = 0.0
reasoning-preserve = 1

