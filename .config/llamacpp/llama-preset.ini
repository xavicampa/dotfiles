version = 1

[*]
flash-attn = on

[ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF:IQ3_S]
hf-repo = ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF:IQ3_S
; chat-template-file REMOVED 2026-10-23: froggeric/Qwen-Fixed-Chat-Templates was deleted from the
; HF cache; llama.cpp now uses the chat template embedded in the GGUF itself.
ctx-size = 131072
ctk = q8_0
ctv = q8_0
; MTP draft: ggml-org self-contained MTP Q4_0 (2.2 GB), re-downloaded 2026-10-23 from
; ggml-org/Qwen3.8-Flash-Next-GGUF rev 91fb0035 (file dated 2026-10-21; the rev this file lived at
; on 2026-10-20 is gone, so the path hash changed). Carries token_embd + output + blk.48.nextn.*
; (the base MTP block, 49 blocks vs the target's 48) - the shape check passes: the target ships
; output.weight, output_hc_down/norm.weight, which is what the pre-10-21 build failed on
; (check_tensor_dims 'output_hc_norm.weight' not found).
; The target is the ukisai Swift FINE-TUNE and the draft is the BASE model's MTP, so shapes match
; (qwen4exp, emb 2560, 512 experts) but the draft is off-distribution: watch the acceptance rate
; (watch "spec decoding stats" in the log) and drop spec-draft-n-max to 1 if it is under ~50 %.
spec-type = draft-mtp
spec-draft-model = /root/.cache/huggingface/hub/models--ggml-org--Qwen3.8-Flash-Next-GGUF/snapshots/91fb00353e766eb43944ed223665ea4fb87dad47/mtp-Qwen3.8-Flash-Next-Q4_0.gguf
spec-draft-n-max = 3
; draft pinned to the 24G card (CUDA1 = 3090 Ti), like the mmproj
spec-draft-device = CUDA1
mmproj-device = CUDA1
; no mmap: mmap + CPU tensor overrides logged perf warnings and earlier OOM retries. Costs
; ~40 GB committed RAM + ~33 s load, no downside seen.
load-mode = none
; ubatch is THE prefill lever: defaults (b 2048 / ub 512) ~250 t/s -> ~600 t/s here.
; Prefill saturates the 5070 Ti x16 link (~28 GB/s rx); the 3090 Ti stays near idle.
batch-size = 8192
ubatch-size = 2048
temperature = 1.0
min-p = 0.00
top-p = 0.95
top-k = 20
repeat-penalty = 1.0
presence-penalty = 0.0
reasoning-preserve = 1
moe-cache-mib = 18000
cmoe = 1
tensor-split = 20,24

