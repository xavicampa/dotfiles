version = 1

[*]
flash-attn = on

[ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF:IQ3_S]
hf-repo = ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF:IQ3_S
chat-template-file = /root/.cache/huggingface/hub/models--froggeric--Qwen-Fixed-Chat-Templates/snapshots/3be7669fac73085a458e20e81ee9dc5c322aefb2/chat_template.jinja
ctx-size = 131072
ctk = q8_0
ctv = q8_0
; no llama.cpp speculation: the ggml-org MTP draft GGUF (mtp-Qwen3.8-Flash-Next-Q4_0) was
; deleted 2026-10-20 (Strata serves this model with its own draft in strata-data /data/mtp/rt).
mmproj-device = CUDA1
; NOTE 2026-09-29 (5070 Ti = device 1): the 1434 MiB compute buffer (ubatch 1024) OOMs at load
; -> "retrying without pipeline parallelism". The fallback is HARMLESS: prefill ~600 t/s.
; Raising the margin (5632) starved GPU weights and regressed prefill - do not.
; Note: llama device order in the container is CUDA1=3090 Ti (PCIe 4.0 x4!), CUDA0=5070 Ti (x16)
; (reversed vs host nvidia-smi). Verify traffic: nvidia-smi dmon -s t (rxpci/txpci MB/s per GPU).
fit-target = 0,0
; op-offload = off   ; DO NOT re-enable: regresses prompt processing to < 200 t/s (measured 2026-09-29)
; no mmap: mmap + CPU tensor overrides logged perf warnings and earlier OOM retries. Costs
; ~40 GB committed RAM + ~33 s load, no downside seen.
load-mode = none
; ubatch is THE prefill lever: defaults (b 2048 / ub 512) ~250 t/s -> ~600 t/s here.
; Prefill saturates the 5070 Ti x16 link (~28 GB/s rx); the 3090 Ti stays near idle.
batch-size = 8192
ubatch-size = 2048
temperature = 1.0
min-p = 0.00
top-p = 0.95
top-k = 20
repeat-penalty = 1.0
presence-penalty = 0.0
reasoning-preserve = 1

