# Force mpv's rendering onto the Intel iGPU (ignore the NVIDIA GPUs).
# Vulkan lets mpv name-pick the device directly; this survives driver / EGL-vendor changes.
gpu-api=vulkan
vulkan-device=Intel(R) Graphics (ARL)

# Optional: also run hardware decoding on the iGPU (renderD128 is the Intel GPU here).
# Uncomment if you want decode offloaded to the iGPU too.
# hwdec=vaapi
# vaapi-device=/dev/dri/renderD128
