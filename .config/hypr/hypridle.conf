# hypridle - Hyprland's idle daemon. Live again for the DELL:
#   services.hypridle.enable = true   (in ~/.config/nixos/dell/configuration.nix;
#   programs.hyprlock.enable there pulls it in anyway)
# The unit that module installs is ConditionEnvironment=WAYLAND_DISPLAY and
# WantedBy=graphical-session.target, so it comes up only in a Wayland (Hyprland)
# session - never in the dell's i3/X session.
#
# homepc does not run hypridle at all: services.hypridle stays off there and DMS's
# IdleService (Quickshell IdleMonitor) does the job, with the timeouts in
# ~/.config/DankMaterialShell/settings.json (acLockTimeout=300,
# acPostLockMonitorTimeout=300). The dotfiles are shared, so this file sits on
# homepc too but is never read.
#
# Parked in ~/.config/hypr/legacy/ during the Lua/DMS migration (a280d3c), moved
# back 2026-10-18 when lock/idle became host-owned. hypridle refuses to start
# without a config, so this file has to stay where it is.

general {
    # Fires on a logind lock (`loginctl lock-session`, and before_sleep below), NOT
    # on the idle timer at the bottom - there is no hypridle timeout that locks.
    # pidof/hyprlock/hyprctl are on the unit's PATH: the NixOS hypridle module puts
    # programs.hyprland.package, programs.hyprlock.package and procps on it.
    lock_cmd = pidof hyprlock || hyprlock

    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Screen off after 5 min idle; the session stays unlocked (DPMS only). Resume on
# any input wakes the panel again.
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 15 min idle - off, same as before the migration. With this enabled
# before_sleep_cmd above means every suspend goes through loginctl lock-session ->
# hyprlock, so you type your password on wake.
# listener {
#     timeout = 900
#     on-timeout = systemctl suspend
# }

# Locking by hand on the dell: `loginctl lock-session` (that is what lock_cmd
# turns into hyprlock) - DMS's SUPER+ALT+L belongs to dms.service, which the dell
# does not run.
