# hyprlock - Hyprland's GPU-accelerated screen locker. Live for the DELL:
#   programs.hyprlock.enable = true   (~/.config/nixos/dell/configuration.nix)
# which also gives it the PAM service (security.pam.services.hyprlock ->
# /etc/pam.d/hyprlock) and turns services.hypridle on.
#
# This file is what was actually missing before 2026-10-18: the pre-DMS config had
# `programs.hyprlock.enable = true` in common.nix, which installed the binary + PAM
# stack but never any config - and hyprlock exits with an error when it cannot find
# one, so the lock path was dead (hypridle's lock_cmd just spawned a failing binary).
#
# Search order: $XDG_CONFIG_HOME/hypr/hyprlock.conf, then each $XDG_CONFIG_DIRS dir.
# There is no --check/--verify flag; test the look with `hyprlock --verbose` and a
# real lock, unlock with your login password.
#
# homepc never loads this: programs.hyprlock stays off there and DMS owns the lock
# screen (`dms ipc call lock lock`, SUPER+ALT+L, Quickshell's own lock UI).

general {
    # no countdown before the password is accepted/required
    grace = 0
    # an empty Enter is an error, not a successful unlock
    ignore_empty_input = false
    # keep the pointer visible (laptop touchpad, no DMS cursor theming here)
    hide_cursor = false
    # ms before the field resets after a failed attempt
    fail_timeout = 2000
}

auth {
    # PAM service from programs.hyprlock.enable; if the module were missing hyprlock
    # silently falls back to "su".
    pam:enabled = true
    pam:module = hyprlock
    # no fingerprint reader wired up; flip to true if the dell's gets enabled
    fingerprint:enabled = false
}

background {
    # monitor empty = every output (the dell has a lid panel + optional dock ports)
    monitor =
    # grab the desktop and blur it - host-agnostic, so nothing here depends on a
    # wallpaper path that only exists on one box. `color` is the fallback if the
    # grab fails (catppuccin mocha base, matching the SDDM theme in common.nix).
    path = screenshot
    color = rgba(30, 30, 46, 1.0)
    blur_passes = 3
    blur_size = 7
}

label {
    monitor =
    text = <b>$USER</b>
    color = rgba(205, 214, 244, 1.0)
    font_family = sans-serif
    font_size = 28
    halign = center
    valign = center
    position = 0, -100
}

input-field {
    monitor =
    size = 20%, 5%
    position = 0, 0
    rounding = -1
    outline_thickness = 3
    dots_size = 0.23
    dots_spacing = 0.15
    dots_center = true
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    hide_input = false
    inner_color = rgba(24, 24, 37, 0.8)
    outer_color = rgba(137, 180, 250, 0.6)
    font_color = rgba(205, 214, 244, 1.0)
    check_color = rgba(249, 226, 175, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(250, 179, 135, 1.0)
    numlock_color = rgba(250, 179, 135, 1.0)
    bothlock_color = rgba(250, 179, 135, 1.0)
}
